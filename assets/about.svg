<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624" fill="none" role="img">
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6EE7B7"/><stop offset=".45" stop-color="#34D399"/>
    <stop offset=".8" stop-color="#2DD4BF"/><stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>
  <linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6EE7B7"/><stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6EE7B7"/><stop offset="1" stop-color="#6EE7B7" stop-opacity="0"/>
  </linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1.4" cy="1.4" r="1.4" fill="#FFFFFF" fill-opacity=".05"/>
  </pattern>
  <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="58"/>
  </filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#000" flood-opacity=".42"/>
  </filter>
<clipPath id="shell"><rect width="1200" height="624" rx="20"/></clipPath>
</defs>
<style>
  text { font-family:'Segoe UI',Roboto,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; }
  .mono { font-family:'SFMono-Regular',ui-monospace,Consolas,'Liberation Mono',Menlo,monospace; }
  @keyframes rise    { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  @keyframes slideL  { from { opacity:0; transform:translateX(-22px); } to { opacity:1; transform:translateX(0); } }
  @keyframes slideR  { from { opacity:0; transform:translateX(22px); } to { opacity:1; transform:translateX(0); } }
  @keyframes fade    { from { opacity:0; } to { opacity:1; } }
  @keyframes grow    { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  @keyframes blink   { 0%,45% { opacity:1; } 55%,100% { opacity:0; } }
  @keyframes drift   { 0%,100% { transform:translate(0,0) scale(1); } 50% { transform:translate(46px,-30px) scale(1.16); } }
  @keyframes drift2  { 0%,100% { transform:translate(0,0) scale(1.1); } 50% { transform:translate(-52px,26px) scale(.9); } }
  @keyframes halo    { 0%,100% { opacity:.34; } 50% { opacity:.8; } }
  @keyframes ping    { 0% { transform:scale(.7); opacity:.85; } 100% { transform:scale(2.6); opacity:0; } }
  @keyframes bob     { 0%,100% { transform:translateY(0); } 50% { transform:translateY(7px); } }
  @keyframes typeline{ from { clip-path:inset(0 100% 0 0); } to { clip-path:inset(0 0 0 0); } }
  @keyframes ringgrow{ from { stroke-dashoffset:var(--circ); } to { stroke-dashoffset:var(--off); } }
  .rise  { animation:rise .85s cubic-bezier(.22,1,.36,1) both; }
  .slide { animation:slideL .85s cubic-bezier(.22,1,.36,1) both; }
  .slideR{ animation:slideR .85s cubic-bezier(.22,1,.36,1) both; }
  .in    { animation:fade 1s ease both; }
  .bar   { transform-box:fill-box; transform-origin:left center;
            animation:grow 1.15s cubic-bezier(.22,1,.36,1) both; }
  .caret { animation:blink 1.1s steps(1) infinite; }
  .blob  { transform-box:fill-box; transform-origin:center;
            animation:drift 17s ease-in-out infinite; }
  .blob2 { transform-box:fill-box; transform-origin:center;
            animation:drift2 21s ease-in-out infinite; }
  .halo  { animation:halo 4.5s ease-in-out infinite; }
  .ping  { transform-box:fill-box; transform-origin:center;
            animation:ping 2.6s ease-out infinite; }
  .bob   { animation:bob 2.1s ease-in-out infinite; }
  .typeline { animation:typeline .7s steps(28) both; }
  .ring  { animation:ringgrow 1.3s cubic-bezier(.22,1,.36,1) both; }
  @media (prefers-reduced-motion:reduce) {
    .rise,.slide,.slideR,.in,.bar,.caret,.blob,.blob2,.halo,.ping,.bob,.typeline,.ring {
      animation:none !important; opacity:1 !important; transform:none !important;
      stroke-dashoffset:0 !important; clip-path:none !important;
    }
  }

</style>
<g clip-path="url(#shell)"><rect width="1200" height="624" fill="#080808"/><rect width="1200" height="624" fill="url(#dots)"/><g class="slide"><rect x="70" y="30" width="3" height="52" rx="1.5" fill="url(#accentV)"/><text x="90" y="49" font-size="11.5" font-weight="700" letter-spacing="2.4" fill="#5A5A5A">01 — WHO I AM</text><text x="89" y="80" font-size="34" font-weight="800" letter-spacing="-.8" fill="#F0F0F0">About me</text></g><rect x="281" y="67" width="848" height="1" fill="url(#fade)" class="bar" style="animation-delay:.5s"/><circle cx="1116" cy="56" r="4" fill="#6EE7B7" class="halo"/><circle cx="1116" cy="56" r="4" fill="#6EE7B7" class="ping"/><g transform="translate(0,104)"><g class="rise" style="animation-delay:.06s" filter="url(#soft)"><rect x="70" y="20" width="1060" height="190" rx="16" fill="#0F0F0F" stroke="#1F1F1F" stroke-width="1"/><rect x="70" y="20" width="4" height="190" rx="2" fill="url(#accentV)"/></g><g class="in" style="animation-delay:.2s"><text x="110" y="66" font-size="12" font-weight="700" letter-spacing="2" fill="#6EE7B7">WHO I AM</text><text x="110" y="98" font-size="16" fill="#888888">Full-Stack Software Engineer based in Lahore, Pakistan — 3+ years turning</text><text x="110" y="124" font-size="16" fill="#888888">requirements into shipped products. Started with PHP &amp; Laravel, now building</text><text x="110" y="150" font-size="16" fill="#888888">with React, Next.js, NestJS and wiring OpenAI/RAG into production apps.</text></g><g class="rise" style="animation-delay:0.30s" filter="url(#soft)"><rect x="70.0" y="230" width="340.0" height="150" rx="16" fill="#0F0F0F" stroke="#1F1F1F" stroke-width="1"/><rect x="70.0" y="230" width="340.0" height="3" rx="1.5" fill="#6EE7B7"/><rect x="94.0" y="254" width="42" height="42" rx="12" fill="#6EE7B7" fill-opacity=".14"/><text x="115.0" y="281" font-size="20" text-anchor="middle">🏗️</text><text x="94.0" y="326" font-size="15.5" font-weight="750" fill="#F0F0F0">End-to-end delivery</text><text x="94.0" y="348" font-size="12.5" fill="#5A5A5A">Frontend, backend and the AI layer</text><text x="94.0" y="366" font-size="12.5" fill="#5A5A5A">— one engineer, no handoff gaps.</text></g><g class="rise" style="animation-delay:0.40s" filter="url(#soft)"><rect x="430.0" y="230" width="340.0" height="150" rx="16" fill="#0F0F0F" stroke="#1F1F1F" stroke-width="1"/><rect x="430.0" y="230" width="340.0" height="3" rx="1.5" fill="#2DD4BF"/><rect x="454.0" y="254" width="42" height="42" rx="12" fill="#2DD4BF" fill-opacity=".14"/><text x="475.0" y="281" font-size="20" text-anchor="middle">🤖</text><text x="454.0" y="326" font-size="15.5" font-weight="750" fill="#F0F0F0">AI-powered features</text><text x="454.0" y="348" font-size="12.5" fill="#5A5A5A">RAG pipelines, embeddings and LLM</text><text x="454.0" y="366" font-size="12.5" fill="#5A5A5A">APIs wired into real apps.</text></g><g class="rise" style="animation-delay:0.50s" filter="url(#soft)"><rect x="790.0" y="230" width="340.0" height="150" rx="16" fill="#0F0F0F" stroke="#1F1F1F" stroke-width="1"/><rect x="790.0" y="230" width="340.0" height="3" rx="1.5" fill="#22D3EE"/><rect x="814.0" y="254" width="42" height="42" rx="12" fill="#22D3EE" fill-opacity=".14"/><text x="835.0" y="281" font-size="20" text-anchor="middle">🔌</text><text x="814.0" y="326" font-size="15.5" font-weight="750" fill="#F0F0F0">8+ integrations</text><text x="814.0" y="348" font-size="12.5" fill="#5A5A5A">Payments, data and AI tooling</text><text x="814.0" y="366" font-size="12.5" fill="#5A5A5A">connected to production systems.</text></g><g class="rise" style="animation-delay:.7s" filter="url(#soft)"><rect x="70" y="400" width="1060" height="100" rx="16" fill="#161616" stroke="#1F1F1F" stroke-width="1"/></g><g class="in" style="animation-delay:.85s"><text x="102" y="434" font-size="11.5" font-weight="700" letter-spacing="2.2" fill="#5A5A5A">WHAT I FOCUS ON</text><g><rect x="100" y="448" width="150" height="30" rx="15" fill="#6EE7B7" fill-opacity=".1" stroke="#6EE7B755" stroke-width="1"/><text x="175.0" y="467.5" font-size="12.5" font-weight="600" fill="#F0F0F0" text-anchor="middle">🌐 Full-Stack Web</text></g><g><rect x="260" y="448" width="105" height="30" rx="15" fill="#34D399" fill-opacity=".1" stroke="#34D39955" stroke-width="1"/><text x="312.5" y="467.5" font-size="12.5" font-weight="600" fill="#F0F0F0" text-anchor="middle">🤖 AI &amp; RAG</text></g><g><rect x="375" y="448" width="165" height="30" rx="15" fill="#2DD4BF" fill-opacity=".1" stroke="#2DD4BF55" stroke-width="1"/><text x="457.5" y="467.5" font-size="12.5" font-weight="600" fill="#F0F0F0" text-anchor="middle">🔌 API Integrations</text></g><g><rect x="550" y="448" width="165" height="30" rx="15" fill="#22D3EE" fill-opacity=".1" stroke="#22D3EE55" stroke-width="1"/><text x="632.5" y="467.5" font-size="12.5" font-weight="600" fill="#F0F0F0" text-anchor="middle">🗄️ Database Design</text></g><g><rect x="725" y="448" width="127" height="30" rx="15" fill="#6EE7B7" fill-opacity=".1" stroke="#6EE7B755" stroke-width="1"/><text x="788.5" y="467.5" font-size="12.5" font-weight="600" fill="#F0F0F0" text-anchor="middle">☁️ Deployment</text></g></g></g></g><rect x=".75" y=".75" width="1198.5" height="622.5" rx="20" fill="none" stroke="#1F1F1F" stroke-width="1.5"/>
</svg>
