<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 356" width="1200" height="356" fill="none" role="img">
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6EE7B7"/><stop offset=".45" stop-color="#34D399"/>
    <stop offset=".8" stop-color="#2DD4BF"/><stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>
  <linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6EE7B7"/><stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6EE7B7"/><stop offset="1" stop-color="#6EE7B7" stop-opacity="0"/>
  </linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1.4" cy="1.4" r="1.4" fill="#FFFFFF" fill-opacity=".05"/>
  </pattern>
  <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="58"/>
  </filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#000" flood-opacity=".42"/>
  </filter>
<clipPath id="shell"><rect width="1200" height="356" rx="20"/></clipPath>
</defs>
<style>
  text { font-family:'Segoe UI',Roboto,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; }
  .mono { font-family:'SFMono-Regular',ui-monospace,Consolas,'Liberation Mono',Menlo,monospace; }
  @keyframes rise    { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  @keyframes slideL  { from { opacity:0; transform:translateX(-22px); } to { opacity:1; transform:translateX(0); } }
  @keyframes slideR  { from { opacity:0; transform:translateX(22px); } to { opacity:1; transform:translateX(0); } }
  @keyframes fade    { from { opacity:0; } to { opacity:1; } }
  @keyframes grow    { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  @keyframes blink   { 0%,45% { opacity:1; } 55%,100% { opacity:0; } }
  @keyframes drift   { 0%,100% { transform:translate(0,0) scale(1); } 50% { transform:translate(46px,-30px) scale(1.16); } }
  @keyframes drift2  { 0%,100% { transform:translate(0,0) scale(1.1); } 50% { transform:translate(-52px,26px) scale(.9); } }
  @keyframes halo    { 0%,100% { opacity:.34; } 50% { opacity:.8; } }
  @keyframes ping    { 0% { transform:scale(.7); opacity:.85; } 100% { transform:scale(2.6); opacity:0; } }
  @keyframes bob     { 0%,100% { transform:translateY(0); } 50% { transform:translateY(7px); } }
  @keyframes typeline{ from { clip-path:inset(0 100% 0 0); } to { clip-path:inset(0 0 0 0); } }
  @keyframes ringgrow{ from { stroke-dashoffset:var(--circ); } to { stroke-dashoffset:var(--off); } }
  .rise  { animation:rise .85s cubic-bezier(.22,1,.36,1) both; }
  .slide { animation:slideL .85s cubic-bezier(.22,1,.36,1) both; }
  .slideR{ animation:slideR .85s cubic-bezier(.22,1,.36,1) both; }
  .in    { animation:fade 1s ease both; }
  .bar   { transform-box:fill-box; transform-origin:left center;
            animation:grow 1.15s cubic-bezier(.22,1,.36,1) both; }
  .caret { animation:blink 1.1s steps(1) infinite; }
  .blob  { transform-box:fill-box; transform-origin:center;
            animation:drift 17s ease-in-out infinite; }
  .blob2 { transform-box:fill-box; transform-origin:center;
            animation:drift2 21s ease-in-out infinite; }
  .halo  { animation:halo 4.5s ease-in-out infinite; }
  .ping  { transform-box:fill-box; transform-origin:center;
            animation:ping 2.6s ease-out infinite; }
  .bob   { animation:bob 2.1s ease-in-out infinite; }
  .typeline { animation:typeline .7s steps(28) both; }
  .ring  { animation:ringgrow 1.3s cubic-bezier(.22,1,.36,1) both; }
  @media (prefers-reduced-motion:reduce) {
    .rise,.slide,.slideR,.in,.bar,.caret,.blob,.blob2,.halo,.ping,.bob,.typeline,.ring {
      animation:none !important; opacity:1 !important; transform:none !important;
      stroke-dashoffset:0 !important; clip-path:none !important;
    }
  }

</style>
<g clip-path="url(#shell)"><rect width="1200" height="356" fill="#080808"/><rect width="1200" height="356" fill="url(#dots)"/><g filter="url(#blur)" opacity=".26"><circle class="blob" cx="120" cy="53" r="142" fill="#6EE7B7"/><circle class="blob2" cx="1032" cy="291" r="128" fill="#22D3EE"/></g><rect width="1200" height="3" fill="url(#accent)"/><g class="rise" style="animation-delay:.05s"><rect x="72" y="70" width="9" height="9" rx="4.5" fill="#6EE7B7" class="halo"/><text x="94" y="79" font-size="13" font-weight="700" letter-spacing="2.6" fill="#888888">FULL-STACK SOFTWARE ENGINEER</text></g><g class="rise" style="animation-delay:.18s"><text x="70" y="180" font-size="84" font-weight="800" letter-spacing="-2.6" fill="#F0F0F0">Ali <tspan fill="url(#accent)">Husnain</tspan></text></g><g class="rise" style="animation-delay:.32s"><text x="72" y="226" class="mono" font-size="18" fill="#888888"><tspan fill="#6EE7B7">&gt;</tspan> building full-stack web apps &amp; AI/RAG-powered products<tspan class="caret" fill="#22D3EE">_</tspan></text></g><g class="rise" style="animation-delay:.44s"><text x="72" y="264" font-size="15.5" fill="#5A5A5A">3+ years shipping production code — from PHP/Laravel foundations</text><text x="72" y="288" font-size="15.5" fill="#5A5A5A">to Node.js, NestJS &amp; LLM-driven applications.</text></g><g filter="url(#blur)" opacity=".35"><circle class="blob" cx="1017.0" cy="207.0" r="190" fill="#6EE7B7"/></g><g transform="rotate(-5 1017.0 207.0)"><g class="rise" style="animation-delay:0.50s" filter="url(#soft)"><rect x="858" y="90" width="150" height="108" rx="16" fill="#0F0F0F" stroke="#1F1F1F" stroke-width="1"/><circle cx="886" cy="120" r="4" fill="#6EE7B7" class="halo"/><text x="880" y="162" font-size="30" font-weight="800" fill="#6EE7B7">3+</text><text x="880" y="182" font-size="10" font-weight="700" letter-spacing="1.4" fill="#5A5A5A">YEARS</text></g><g class="rise" style="animation-delay:0.60s" filter="url(#soft)"><rect x="1026" y="90" width="150" height="108" rx="16" fill="#0F0F0F" stroke="#1F1F1F" stroke-width="1"/><circle cx="1054" cy="120" r="4" fill="#34D399" class="halo"/><text x="1048" y="162" font-size="30" font-weight="800" fill="#34D399">15+</text><text x="1048" y="182" font-size="10" font-weight="700" letter-spacing="1.4" fill="#5A5A5A">SHIPPED</text></g><g class="rise" style="animation-delay:0.70s" filter="url(#soft)"><rect x="858" y="216" width="150" height="108" rx="16" fill="#0F0F0F" stroke="#1F1F1F" stroke-width="1"/><circle cx="886" cy="246" r="4" fill="#2DD4BF" class="halo"/><text x="880" y="288" font-size="30" font-weight="800" fill="#2DD4BF">10+</text><text x="880" y="308" font-size="10" font-weight="700" letter-spacing="1.4" fill="#5A5A5A">INTEGRATIONS</text></g><g class="rise" style="animation-delay:0.80s" filter="url(#soft)"><rect x="1026" y="216" width="150" height="108" rx="16" fill="#0F0F0F" stroke="#1F1F1F" stroke-width="1"/><circle cx="1054" cy="246" r="4" fill="#22D3EE" class="halo"/><text x="1048" y="288" font-size="30" font-weight="800" fill="#22D3EE">3</text><text x="1048" y="308" font-size="10" font-weight="700" letter-spacing="1.4" fill="#5A5A5A">COMPANIES</text></g></g></g><rect x=".75" y=".75" width="1198.5" height="354.5" rx="20" fill="none" stroke="#1F1F1F" stroke-width="1.5"/>
</svg>
