<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 348" width="1200" height="348" fill="none" role="img">
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6EE7B7"/><stop offset=".45" stop-color="#34D399"/>
    <stop offset=".8" stop-color="#2DD4BF"/><stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>
  <linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6EE7B7"/><stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6EE7B7"/><stop offset="1" stop-color="#6EE7B7" stop-opacity="0"/>
  </linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1.4" cy="1.4" r="1.4" fill="#FFFFFF" fill-opacity=".05"/>
  </pattern>
  <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="58"/>
  </filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#000" flood-opacity=".42"/>
  </filter>
<clipPath id="shell"><path d="M20,0 L1180,0 A20,20 0 0 1 1200,20 L1200,328 A20,20 0 0 1 1180,348 L20,348 A20,20 0 0 1 0,328 L0,20 A20,20 0 0 1 20,0 Z"/></clipPath>
</defs>
<style>
  text { font-family:'Segoe UI',Roboto,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; }
  .mono { font-family:'SFMono-Regular',ui-monospace,Consolas,'Liberation Mono',Menlo,monospace; }
  @keyframes rise    { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  @keyframes slideL  { from { opacity:0; transform:translateX(-22px); } to { opacity:1; transform:translateX(0); } }
  @keyframes slideR  { from { opacity:0; transform:translateX(22px); } to { opacity:1; transform:translateX(0); } }
  @keyframes fade    { from { opacity:0; } to { opacity:1; } }
  @keyframes grow    { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  @keyframes blink   { 0%,45% { opacity:1; } 55%,100% { opacity:0; } }
  @keyframes drift   { 0%,100% { transform:translate(0,0) scale(1); } 50% { transform:translate(46px,-30px) scale(1.16); } }
  @keyframes drift2  { 0%,100% { transform:translate(0,0) scale(1.1); } 50% { transform:translate(-52px,26px) scale(.9); } }
  @keyframes halo    { 0%,100% { opacity:.34; } 50% { opacity:.8; } }
  @keyframes ping    { 0% { transform:scale(.7); opacity:.85; } 100% { transform:scale(2.6); opacity:0; } }
  @keyframes bob     { 0%,100% { transform:translateY(0); } 50% { transform:translateY(7px); } }
  @keyframes typeline{ from { clip-path:inset(0 100% 0 0); } to { clip-path:inset(0 0 0 0); } }
  @keyframes ringgrow{ from { stroke-dashoffset:var(--circ); } to { stroke-dashoffset:var(--off); } }
  .rise  { animation:rise .85s cubic-bezier(.22,1,.36,1) both; }
  .slide { animation:slideL .85s cubic-bezier(.22,1,.36,1) both; }
  .slideR{ animation:slideR .85s cubic-bezier(.22,1,.36,1) both; }
  .in    { animation:fade 1s ease both; }
  .bar   { transform-box:fill-box; transform-origin:left center;
            animation:grow 1.15s cubic-bezier(.22,1,.36,1) both; }
  .caret { animation:blink 1.1s steps(1) infinite; }
  .blob  { transform-box:fill-box; transform-origin:center;
            animation:drift 17s ease-in-out infinite; }
  .blob2 { transform-box:fill-box; transform-origin:center;
            animation:drift2 21s ease-in-out infinite; }
  .halo  { animation:halo 4.5s ease-in-out infinite; }
  .ping  { transform-box:fill-box; transform-origin:center;
            animation:ping 2.6s ease-out infinite; }
  .bob   { animation:bob 2.1s ease-in-out infinite; }
  .typeline { animation:typeline .7s steps(28) both; }
  .ring  { animation:ringgrow 1.3s cubic-bezier(.22,1,.36,1) both; }
  @media (prefers-reduced-motion:reduce) {
    .rise,.slide,.slideR,.in,.bar,.caret,.blob,.blob2,.halo,.ping,.bob,.typeline,.ring {
      animation:none !important; opacity:1 !important; transform:none !important;
      stroke-dashoffset:0 !important; clip-path:none !important;
    }
  }

</style>
<g clip-path="url(#shell)"><rect width="1200" height="348" fill="#080808"/><rect width="1200" height="348" fill="url(#dots)"/><g filter="url(#blur)" opacity=".26"><circle class="blob" cx="120" cy="52" r="139" fill="#6EE7B7"/><circle class="blob2" cx="1032" cy="285" r="125" fill="#22D3EE"/></g><g class="slide"><rect x="70" y="30" width="3" height="52" rx="1.5" fill="url(#accentV)"/><text x="90" y="49" font-size="11.5" font-weight="700" letter-spacing="2.4" fill="#5A5A5A">06 — SAY HELLO</text><text x="89" y="80" font-size="34" font-weight="800" letter-spacing="-.8" fill="#F0F0F0">Get in touch</text></g><rect x="357" y="67" width="772" height="1" fill="url(#fade)" class="bar" style="animation-delay:.5s"/><circle cx="1116" cy="56" r="4" fill="#2DD4BF" class="halo"/><circle cx="1116" cy="56" r="4" fill="#2DD4BF" class="ping"/><g transform="translate(0,104)"><text x="600" y="76" font-size="30" font-weight="800" letter-spacing="-.6" fill="#F0F0F0" text-anchor="middle" class="rise">Let&#39;s build something <tspan fill="url(#accent)">great</tspan>.</text><text x="600" y="110" font-size="14.5" fill="#888888" text-anchor="middle" class="rise" style="animation-delay:.12s">Got an idea that needs building, or a team that needs a full-stack engineer? My inbox is open.</text><g class="rise" style="animation-delay:.24s"><rect x="410" y="142" width="380" height="1" fill="url(#fade)"/><text x="600" y="176" class="mono" font-size="14" fill="#2DD4BF" text-anchor="middle">alihusnaindhaulka124@gmail.com</text><text x="600" y="206" font-size="12" fill="#5A5A5A" text-anchor="middle">Usually replies within a day · Lahore, Pakistan · Available for collaboration</text></g><path d="M592 226l8 9 8-9" stroke="#5A5A5A" stroke-width="2" stroke-linecap="round" fill="none" class="bob"/></g></g><path d="M20,0 L1180,0 A20,20 0 0 1 1200,20 L1200,328 A20,20 0 0 1 1180,348 L20,348 A20,20 0 0 1 0,328 L0,20 A20,20 0 0 1 20,0 Z" fill="none" stroke="#1F1F1F" stroke-width="1.5"/>
</svg>
