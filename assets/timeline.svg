<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 668" width="1200" height="668" fill="none" role="img">
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6EE7B7"/><stop offset=".45" stop-color="#34D399"/>
    <stop offset=".8" stop-color="#2DD4BF"/><stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>
  <linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6EE7B7"/><stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6EE7B7"/><stop offset="1" stop-color="#6EE7B7" stop-opacity="0"/>
  </linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1.4" cy="1.4" r="1.4" fill="#FFFFFF" fill-opacity=".05"/>
  </pattern>
  <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="58"/>
  </filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#000" flood-opacity=".42"/>
  </filter>
<clipPath id="shell"><rect width="1200" height="668" rx="20"/></clipPath>
</defs>
<style>
  text { font-family:'Segoe UI',Roboto,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; }
  .mono { font-family:'SFMono-Regular',ui-monospace,Consolas,'Liberation Mono',Menlo,monospace; }
  @keyframes rise    { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  @keyframes slideL  { from { opacity:0; transform:translateX(-22px); } to { opacity:1; transform:translateX(0); } }
  @keyframes slideR  { from { opacity:0; transform:translateX(22px); } to { opacity:1; transform:translateX(0); } }
  @keyframes fade    { from { opacity:0; } to { opacity:1; } }
  @keyframes grow    { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  @keyframes blink   { 0%,45% { opacity:1; } 55%,100% { opacity:0; } }
  @keyframes drift   { 0%,100% { transform:translate(0,0) scale(1); } 50% { transform:translate(46px,-30px) scale(1.16); } }
  @keyframes drift2  { 0%,100% { transform:translate(0,0) scale(1.1); } 50% { transform:translate(-52px,26px) scale(.9); } }
  @keyframes halo    { 0%,100% { opacity:.34; } 50% { opacity:.8; } }
  @keyframes ping    { 0% { transform:scale(.7); opacity:.85; } 100% { transform:scale(2.6); opacity:0; } }
  @keyframes bob     { 0%,100% { transform:translateY(0); } 50% { transform:translateY(7px); } }
  @keyframes typeline{ from { clip-path:inset(0 100% 0 0); } to { clip-path:inset(0 0 0 0); } }
  @keyframes ringgrow{ from { stroke-dashoffset:var(--circ); } to { stroke-dashoffset:var(--off); } }
  .rise  { animation:rise .85s cubic-bezier(.22,1,.36,1) both; }
  .slide { animation:slideL .85s cubic-bezier(.22,1,.36,1) both; }
  .slideR{ animation:slideR .85s cubic-bezier(.22,1,.36,1) both; }
  .in    { animation:fade 1s ease both; }
  .bar   { transform-box:fill-box; transform-origin:left center;
            animation:grow 1.15s cubic-bezier(.22,1,.36,1) both; }
  .caret { animation:blink 1.1s steps(1) infinite; }
  .blob  { transform-box:fill-box; transform-origin:center;
            animation:drift 17s ease-in-out infinite; }
  .blob2 { transform-box:fill-box; transform-origin:center;
            animation:drift2 21s ease-in-out infinite; }
  .halo  { animation:halo 4.5s ease-in-out infinite; }
  .ping  { transform-box:fill-box; transform-origin:center;
            animation:ping 2.6s ease-out infinite; }
  .bob   { animation:bob 2.1s ease-in-out infinite; }
  .typeline { animation:typeline .7s steps(28) both; }
  .ring  { animation:ringgrow 1.3s cubic-bezier(.22,1,.36,1) both; }
  @media (prefers-reduced-motion:reduce) {
    .rise,.slide,.slideR,.in,.bar,.caret,.blob,.blob2,.halo,.ping,.bob,.typeline,.ring {
      animation:none !important; opacity:1 !important; transform:none !important;
      stroke-dashoffset:0 !important; clip-path:none !important;
    }
  }

</style>
<g clip-path="url(#shell)"><rect width="1200" height="668" fill="#080808"/><rect width="1200" height="668" fill="url(#dots)"/><g class="slide"><rect x="70" y="30" width="3" height="52" rx="1.5" fill="url(#accentV)"/><text x="90" y="49" font-size="11.5" font-weight="700" letter-spacing="2.4" fill="#5A5A5A">03 — WHERE I'VE BEEN</text><text x="89" y="80" font-size="34" font-weight="800" letter-spacing="-.8" fill="#F0F0F0">Career journey</text></g><rect x="395" y="67" width="734" height="1" fill="url(#fade)" class="bar" style="animation-delay:.5s"/><circle cx="1116" cy="56" r="4" fill="#22D3EE" class="halo"/><circle cx="1116" cy="56" r="4" fill="#22D3EE" class="ping"/><g transform="translate(0,104)"><g filter="url(#blur)" opacity=".16"><circle class="blob" cx="600" cy="282" r="240" fill="#34D399"/></g><text x="70" y="14" font-size="16.5" font-weight="700" fill="#F0F0F0">3+ years · 3 companies · 15+ projects shipped</text><line x1="600" y1="40" x2="600" y2="534" stroke="#1F1F1F" stroke-width="2"/><line x1="600" y1="40" x2="600" y2="534" stroke="url(#accentV)" stroke-width="2" class="bar" style="animation-delay:.2s;transform-origin:top center;"/><circle cx="600" cy="114.0" r="9" fill="#6EE7B7" opacity=".3" class="ping" style="animation-delay:1.00s"/><circle cx="600" cy="114.0" r="8" fill="#080808" stroke="#6EE7B7" stroke-width="3"/><circle cx="600" cy="114.0" r="3" fill="#6EE7B7"/><line x1="550" y1="114.0" x2="600" y2="114.0" stroke="#6EE7B7" stroke-width="1.5" stroke-dasharray="3 4" opacity=".6"/><g class="slide" style="animation-delay:0.30s" filter="url(#soft)"><rect x="120" y="50.0" width="430" height="128" rx="14" fill="#0F0F0F" stroke="#1F1F1F" stroke-width="1"/><rect x="547" y="50.0" width="3" height="128" fill="#6EE7B7"/><text x="148" y="80.0" font-size="11.5" font-weight="700" letter-spacing=".5" fill="#5A5A5A">Mar 2023 — Nov 2024</text><text x="148" y="106.0" font-size="18" font-weight="750" fill="#F0F0F0">Nex Developers ltd</text><text x="148" y="126.0" font-size="12" font-weight="600" fill="#6EE7B7">Full Stack Engineer · Part-time · Remote (UK)</text><text x="148" y="148.0" font-size="11.5" fill="#888888">Worked remotely with a London-based team on</text><text x="148" y="164.0" font-size="11.5" fill="#888888">Express.js + PostgreSQL products, part-time</text><text x="148" y="180.0" font-size="11.5" fill="#888888">alongside other commitments.</text></g><circle cx="600" cy="282.0" r="9" fill="#2DD4BF" opacity=".3" class="ping" style="animation-delay:1.16s"/><circle cx="600" cy="282.0" r="8" fill="#080808" stroke="#2DD4BF" stroke-width="3"/><circle cx="600" cy="282.0" r="3" fill="#2DD4BF"/><line x1="650" y1="282.0" x2="600" y2="282.0" stroke="#2DD4BF" stroke-width="1.5" stroke-dasharray="3 4" opacity=".6"/><g class="slideR" style="animation-delay:0.46s" filter="url(#soft)"><rect x="650" y="218.0" width="430" height="128" rx="14" fill="#0F0F0F" stroke="#1F1F1F" stroke-width="1"/><rect x="650" y="218.0" width="3" height="128" fill="#2DD4BF"/><text x="678" y="248.0" font-size="11.5" font-weight="700" letter-spacing=".5" fill="#5A5A5A">Dec 2024 — Nov 2025</text><text x="678" y="274.0" font-size="18" font-weight="750" fill="#F0F0F0">ILSA Interactive</text><text x="678" y="294.0" font-size="12" font-weight="600" fill="#2DD4BF">Software Engineer · Full-time · Lahore</text><text x="678" y="316.0" font-size="11.5" fill="#888888">Backend-focused engineering with Express.js</text><text x="678" y="332.0" font-size="11.5" fill="#888888">and PostgreSQL, on-site with the Lahore team.</text></g><circle cx="600" cy="450.0" r="9" fill="#22D3EE" opacity=".3" class="ping" style="animation-delay:1.32s"/><circle cx="600" cy="450.0" r="8" fill="#080808" stroke="#22D3EE" stroke-width="3"/><circle cx="600" cy="450.0" r="3" fill="#22D3EE"/><line x1="550" y1="450.0" x2="600" y2="450.0" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="3 4" opacity=".6"/><g class="slide" style="animation-delay:0.62s" filter="url(#soft)"><rect x="120" y="386.0" width="430" height="128" rx="14" fill="#0F0F0F" stroke="#1F1F1F" stroke-width="1"/><rect x="547" y="386.0" width="3" height="128" fill="#22D3EE"/><text x="148" y="416.0" font-size="11.5" font-weight="700" letter-spacing=".5" fill="#5A5A5A">Nov 2025 — Present</text><text x="148" y="442.0" font-size="18" font-weight="750" fill="#F0F0F0">Septem Systems</text><text x="148" y="462.0" font-size="12" font-weight="600" fill="#22D3EE">Full Stack Engineer · Full-time · Lahore</text><text x="148" y="484.0" font-size="11.5" fill="#888888">Current role. Full-stack delivery with</text><text x="148" y="500.0" font-size="11.5" fill="#888888">JavaScript, React.js and the modern</text><text x="148" y="516.0" font-size="11.5" fill="#888888">Node.js toolkit.</text></g><g class="in" style="animation-delay:1.1s"><text x="600" y="556" font-size="12.5" font-weight="600" fill="#2DD4BF" text-anchor="middle">● open to new opportunities</text></g></g></g><rect x=".75" y=".75" width="1198.5" height="666.5" rx="20" fill="none" stroke="#1F1F1F" stroke-width="1.5"/>
</svg>
