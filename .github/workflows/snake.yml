name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2334D399&color_dots=%23161616,%230f3d33,%23127a63,%232dd4bf,%236ee7b7
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2334D399&color_dots=%23161616,%230f3d33,%23127a63,%232dd4bf,%236ee7b7

      - name: Push snake output to the `output` branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
